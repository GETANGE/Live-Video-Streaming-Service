worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript
               application/vnd.apple.mpegurl;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Cache for HLS segments
    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:100m
                     max_size=10g inactive=60m use_temp_path=off;

    # ┌─────────────────────────────────────────────────────────┐
    # │  UPSTREAM: App Server Instances                         │
    # └─────────────────────────────────────────────────────────┘
    upstream app_servers {
        least_conn;  # Load balancing method
        keepalive 32;

        server app1:3000 weight=1 max_fails=3 fail_timeout=30s;
        server app2:3000 weight=1 max_fails=3 fail_timeout=30s;
        server app3:3000 weight=1 max_fails=3 fail_timeout=30s;

        # Health check (nginx plus) or use passive checks above
    }

    # ┌─────────────────────────────────────────────────────────┐
    # │  UPSTREAM: WebSocket (Socket.IO) - IP Hash for sticky   │
    # └─────────────────────────────────────────────────────────┘
    upstream socket_servers {
        ip_hash;  # Sticky sessions for WebSocket

        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    # ┌─────────────────────────────────────────────────────────┐
    # │  MAIN SERVER                                            │
    # └─────────────────────────────────────────────────────────┘
    server {
        listen 3000;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Max upload size (for video uploads)
        client_max_body_size 500M;
        client_body_timeout 300s;

        # ─────────────────────────────────────────────────────
        # Health check endpoint
        # ─────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ─────────────────────────────────────────────────────
        # Nginx status for Prometheus monitoring
        # ─────────────────────────────────────────────────────
        location /nginx_status {
            stub_status on;
            access_log off;
            # Restrict to internal network (Docker)
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }

        # ─────────────────────────────────────────────────────
        # Socket.IO - WebSocket connections
        # ─────────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://socket_servers;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-lived connections
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Disable buffering for real-time
            proxy_buffering off;
        }

        # ─────────────────────────────────────────────────────
        # HLS Streaming - Cached
        # ─────────────────────────────────────────────────────
        location ~ ^/api/stream/(.+\.m3u8)$ {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache playlists briefly (they update frequently)
            proxy_cache hls_cache;
            proxy_cache_valid 200 2s;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location ~ ^/api/stream/(.+\.ts)$ {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache segments longer (they don't change)
            proxy_cache hls_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ─────────────────────────────────────────────────────
        # Video Upload - Rate limited
        # ─────────────────────────────────────────────────────
        location /api/upload {
            limit_req zone=upload_limit burst=10 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://app_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout for uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for large uploads
            proxy_request_buffering off;
        }

        # ─────────────────────────────────────────────────────
        # API Routes - Rate limited
        # ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://app_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─────────────────────────────────────────────────────
        # M-Pesa Callback - No rate limit (from Safaricom)
        # ─────────────────────────────────────────────────────
        location /api/payments/callback {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────────────
        # Metrics & Monitoring (internal only)
        # ─────────────────────────────────────────────────────
        location /metrics {
            # Allow internal/monitoring IPs only
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # deny all;

            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ─────────────────────────────────────────────────────
        # Default - Catch all
        # ─────────────────────────────────────────────────────
        location / {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
