services:
  redis:
    image: redis:latest
    container_name: redis-streaming
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - live-video-streaming-service
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    container_name: nginx_load_balancer
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - live-video-streaming-service
    healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
  
  postgres:
    image: postgres:18
    container_name: postgres-streaming
    environment:
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: streaming_password
      POSTGRES_DB: streaming_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - live-video-streaming-service
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "streaming_user", "-d", "streaming_db"]
      interval: 10s
      timeout: 5s
      retries: 5
        
  rabbitmq:
      image: rabbitmq:3.13-management
      container_name: rabbitmq-streaming
      restart: unless-stopped
  
      ports:
        - "5673:5672"    # AMQP
        - "15673:15672"  # Management UI
  
      environment:
        RABBITMQ_DEFAULT_USER: admin
        RABBITMQ_DEFAULT_PASS: admin123
        RABBITMQ_DEFAULT_VHOST: /
  
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
  
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
  
      networks:
        - live-video-streaming-service

  minio:
    image: minio/minio:latest
    container_name: minio-streaming
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - live-video-streaming-service

networks:
  live-video-streaming-service:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:
  minio_data: